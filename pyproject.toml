[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unihive-engine"
version = "0.1.0"
description = "Deterministic admissions intelligence engine for UniHive"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4,<5",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
]

[project.scripts]
unihive = "cli:main"

[project.optional-dependencies]
dev = [
    "hypothesis>=6",
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
    "types-jsonschema>=4",
    "types-PyYAML>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/unihive"]
exclude = ["^src/unihive/llm/"]
plugins = ["pydantic.mypy"]
