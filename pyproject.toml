[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unihive-engine"
version = "0.1.0"
description = "Deterministic admissions intelligence engine for UniHive"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "jsonschema>=4,<5",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "uvicorn>=0.30,<1",
]

[project.scripts]
unihive = "cli:main"

[project.optional-dependencies]
dev = [
    "hypothesis>=6",
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
    "setuptools>=68",
    "types-jsonschema>=4",
    "types-PyYAML>=6",
    "wheel",
]

[tool.setuptools]
py-modules = ["cli"]
packages = ["unihive", "unihive.llm", "unihive._data"]
package-dir = {"" = ".", "unihive" = "src/unihive", "unihive._data" = "data"}
include-package-data = false

[tool.setuptools.package-data]
"unihive._data" = ["*.yaml", "taxonomy/*.yaml", "schemas/*.json"]
"unihive.llm" = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/unihive"]
exclude = ["^src/unihive/llm/"]
plugins = ["pydantic.mypy"]
