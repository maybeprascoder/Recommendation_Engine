competencies:
  - id: networking
    name: Networking
    fields: []
    parent_ids: []
    child_ids: []
    cip_anchor: null
    description: Analysis, configuration, or diagnosis of network communication, protocols, traffic, and packet behavior.
    supporting_evidence:
      - Configured or diagnosed network behavior and explained the method used.
      - Analyzed packets, protocols, or traffic to answer a stated networking question.
    insufficient_evidence:
      - Naming Wireshark, a network, or a packet capture without a performed method.
      - Describing a security objective without network analysis or configuration.
    common_false_positive_traps:
      - Treating any use of Wireshark as demonstrated networking.
      - Treating cloud deployment or web programming as network engineering.
    provisional: true
    validated_by: null
    source: docs/engine_build_spec_v1.md
