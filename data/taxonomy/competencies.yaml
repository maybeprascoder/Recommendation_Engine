  - id: security
    name: Security
    fields: []
    parent_ids: []
    child_ids: []
    cip_anchor: null
    description: Analysis or implementation of controls, vulnerabilities, threats, detection, or incident response for protecting systems and information.
    supporting_evidence:
      - Investigated suspicious behavior and documented security-relevant indicators.
      - Assessed vulnerabilities or implemented and evaluated a security control.
    insufficient_evidence:
      - Naming Nessus, Kali Linux, Wireshark, or a security topic without performed work.
      - Handling packets without a stated security analysis or protection objective.
    common_false_positive_traps:
      - Treating every network-analysis task as security.
      - Treating a security tool name as vulnerability-analysis evidence.
    provisional: true
    validated_by: null
